    # =====================================================
    # THYFIA - HTTP (certificado + redirecionamento)
    # =====================================================
    server {
        listen 80;
        server_name thyfia.integradata.app.br;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type text/plain;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ----- THYFIA - HTTPS -----
    server {
        listen 443 ssl;
        server_name thyfia.integradata.app.br;

        ssl_certificate /etc/letsencrypt/live/integradata-automation/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/integradata-automation/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        client_max_body_size 20M;   # fotos enviadas para os posts

        location / {
            set $thyfia_upstream http://thyfia:8000;
            proxy_pass $thyfia_upstream;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_read_timeout 120;
        }
    }
