# Coloque na pasta de configs do nginx da VPS (ex.: conf.d/thyfia.conf) e recarregue o nginx.
# Ajuste os caminhos do certificado conforme os outros sites da VPS.
server {
    listen 80;
    server_name thyfia.integradata.app.br;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name thyfia.integradata.app.br;

    ssl_certificate     /etc/letsencrypt/live/thyfia.integradata.app.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thyfia.integradata.app.br/privkey.pem;

    client_max_body_size 20m;   # fotos enviadas para os posts

    location / {
        resolver 127.0.0.11 valid=10s;      # DNS interno do Docker (container pode reiniciar)
        set $upstream http://thyfia:8000;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
