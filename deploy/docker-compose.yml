# Copiado para /opt/thyfia/ na VPS a cada deploy. O .env fica só na VPS (nunca no git).
# O nginx da VPS encaminha https://thyfia.integradata.app.br -> http://thyfia:8000
# (ele precisa estar na mesma rede Docker: PROXY_NETWORK).
services:
  thyfia:
    image: ghcr.io/contatointegradata-spec/thyfia-automacao-vendas:latest
    container_name: thyfia
    restart: unless-stopped
    env_file: .env
    shm_size: "1gb"            # o Chrome precisa de memória compartilhada
    mem_limit: 1536m
    cpus: 0.8                  # a VPS tem 1 CPU; deixa folga para n8n, Evolution e ClinicMedia
    volumes:
      - ./dados:/app/dados
    networks:
      - proxy

networks:
  proxy:
    name: ${PROXY_NETWORK}
    external: true
